apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-backend-deployment
  labels:
    app: mini-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-backend
  template:
    metadata:
      labels:
        app: mini-backend
    spec:
      containers:
      - name: mini-backend
        image: mini-backend:latest
        ports:
        - containerPort: 8000
        imagePullPolicy: Never
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: mini-backend-secrets
              key: API_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mini-backend-secrets
              key: DATABASE_URL
